[package]
name = "disk-care"
version = "0.9.2"
description = "本地磁盘分析与可审核的缓存清理工具"
edition = "2021"

[lib]
name = "disk_care_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
